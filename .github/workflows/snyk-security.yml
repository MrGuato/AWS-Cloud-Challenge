name: Snyk Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Snyk CLI to check for security issues
        uses: snyk/actions/setup@v2.322.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk Code test
        run: snyk code test --sarif > snyk-code.sarif # Run Snyk Code (SAST) analysis and upload result into GitHub

      - name: Snyk Open Source monitor
        run: snyk monitor --all-projects # Run Snyk Open Source (SCA) analysis and upload result to Snyk

      - name: Snyk IaC test and report
        run: snyk iac test --report # Run Snyk Infrastructure as Code (IaC) analysis and upload result to Snyk

      - name: Build a Docker image
        run: docker build -t your/image-to-test .
        continue-on-error: true

      - name: Snyk Container monitor
        run: snyk container monitor your/image-to-test --file=Dockerfile # Run Snyk Container analysis and upload result to Snyk
        if: success()

      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif # Push the Snyk Code results into GitHub Code Scanning tab
